<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="example3"><strong>Hello</strong> World</div>
    <div id="example2"></div>
<script>
  document.getElementById("example2").innerHTML = "<em>New Content</em>";
  // This will render: <em>New Content</em> inside the div
</script>

<script>
  var content = document.getElementById("example3").innerText;
  console.log(content); // Outputs: Hello World (ignores the <strong> tag)
</script>

</body>
</html>
